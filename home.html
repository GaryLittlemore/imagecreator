<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Image Creator</title>
  <link href="style.css" rel="stylesheet" />

  <style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background: #111;
        color: white;
        height: 100vh;
        display: flex;
        flex-direction: column;
    }

    .topbar {
        background: #1f1f1f;
        padding: 15px;
        border-bottom: 2px solid #333;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    label {
        font-size: 18px;
    }

    select {
        padding: 10px 14px;
        font-size: 16px;
        border: none;
        border-radius: 6px;
        background: #2e2e2e;
        color: white;
        cursor: pointer;
    }

    .viewer {
        flex: 1;
        width: 100%;
        height: 100%;
    }

    iframe {
        width: 100%;
        height: 100%;
        border: none;
        background: white;
    }
</style>
  
</head>
<body>

  <script src="http://ajax.googleapis.com/ajax/libs/jquery/1/jquery.min.js"></script>
  <script>
  </script>
</body>
</html>
