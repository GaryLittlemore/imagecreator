<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Image Uploader</title>
</head>
<body>
  <h1>Upload Image</h1>

  <form id="uploadForm">
    <label>
      Folder:
      <input id="folder" type="text" value="images" />
    </label>
    <br><br>

    <label>
      File name:
      <input id="filename" type="text" placeholder="my-image" />
    </label>
    <br><br>

    <label>
      Choose image:
      <input id="file" type="file" accept="image/*" />
    </label>
    <br><br>

    <button type="submit">Upload</button>
  </form>

  <p id="status"></p>

  <script>
    const form = document.getElementById('uploadForm');
    const statusEl = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const fileInput = document.getElementById('file');
      const filenameInput = document.getElementById('filename');
      const folderInput = document.getElementById('folder');

      if (!fileInput.files.length) {
        statusEl.textContent = 'Please choose an image.';
        return;
      }

      const originalFile = fileInput.files[0];
      const baseName = filenameInput.value.trim() || originalFile.name.replace(/\.[^/.]+$/, '');
      const safeName = baseName.replace(/[\/\\:*?"<>|]+/g, '_');
      const folder = folderInput.value.trim().replace(/^\/+|\/+$/g, '');
      const ext = originalFile.name.includes('.')
        ? originalFile.name.split('.').pop()
        : 'png';

      const newFileName = `${safeName}.${ext}`;
      const path = folder ? `${folder}/${newFileName}` : newFileName;

      const renamedFile = new File([originalFile], newFileName, { type: originalFile.type });

      const formData = new FormData();
      formData.append('file', renamedFile);
      formData.append('path', path);

      statusEl.textContent = `Ready to upload as: ${path}`;

      // Send to your backend endpoint here:
      // await fetch('https://your-backend.example/upload', {
      //   method: 'POST',
      //   body: formData
      // });
    });
  </script>
</body>
</html>
