<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub File Uploader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, sans-serif; }
        .drop-zone { transition: all 0.3s; }
        .drop-zone.dragover { background-color: #1f2937; border-color: #22d3ee; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
    <div class="max-w-2xl mx-auto p-6">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-bold text-cyan-400 mb-2">📤 GitHub Uploader</h1>
            <p class="text-zinc-400">Upload & rename files directly to your repo</p>
        </header>

        <div class="bg-zinc-900 rounded-2xl p-8 shadow-xl border border-zinc-800">
            <!-- Config -->
            <div class="grid grid-cols-2 gap-4 mb-8">
                <div>
                    <label class="block text-sm mb-1">Owner / Username</label>
                    <input id="owner" type="text" value="" placeholder="yourusername"
                           class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-3 focus:outline-none focus:border-cyan-400">
                </div>
                <div>
                    <label class="block text-sm mb-1">Repository</label>
                    <input id="repo" type="text" value="" placeholder="my-repo"
                           class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-3 focus:outline-none focus:border-cyan-400">
                </div>
            </div>

            <div class="mb-8">
                <label class="block text-sm mb-1">Personal Access Token <span class="text-red-400 text-xs">(repo scope)</span></label>
                <input id="token" type="password" placeholder="ghp_xxxxxxxxxxxxxxxx"
                       class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-3 focus:outline-none focus:border-cyan-400">
            </div>

            <!-- Folder -->
            <div class="mb-8">
                <label class="block text-sm mb-1">Target Folder (e.g. uploads/images or leave empty for root)</label>
                <input id="folder" type="text" value="" placeholder="folder/subfolder"
                       class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-3 focus:outline-none focus:border-cyan-400">
            </div>

            <!-- File Upload -->
            <div id="dropZone" 
                 class="drop-zone border-2 border-dashed border-zinc-700 rounded-xl p-12 text-center cursor-pointer hover:border-cyan-400 mb-6">
                <input type="file" id="fileInput" class="hidden">
                <div id="fileInfo" class="hidden">
                    <p class="text-cyan-400 font-medium" id="selectedFile"></p>
                    <p class="text-sm text-zinc-500 mt-1" id="fileSize"></p>
                </div>
                <p class="text-zinc-400 mt-4">Drop file here or <span class="underline">browse</span></p>
            </div>

            <!-- Rename -->
            <div class="mb-8">
                <label class="block text-sm mb-1">New Filename (with extension)</label>
                <input id="newName" type="text" placeholder="my-renamed-file.jpg"
                       class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-3 focus:outline-none focus:border-cyan-400">
            </div>

            <button onclick="uploadFile()" 
                    id="uploadBtn"
                    class="w-full bg-cyan-500 hover:bg-cyan-600 disabled:bg-zinc-700 text-black font-semibold py-4 rounded-xl transition">
                🚀 Upload to GitHub
            </button>

            <div id="status" class="mt-6 text-sm text-center min-h-[1.5rem]"></div>
        </div>

        <p class="text-center text-xs text-zinc-500 mt-8">
            Built for GitHub Pages • Uses GitHub REST API
        </p>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        let selectedFile = null;

        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFileSelect);

        dropZone.addEventListener('dragover', e => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        function handleFileSelect(e) {
            if (e.target.files.length) handleFile(e.target.files[0]);
        }

        function handleFile(file) {
            selectedFile = file;
            document.getElementById('fileInfo').classList.remove('hidden');
            document.getElementById('selectedFile').textContent = file.name;
            document.getElementById('fileSize').textContent = (file.size / 1024 / 1024).toFixed(2) + ' MB';
            
            // Auto-suggest new name
            document.getElementById('newName').value = file.name;
        }

        async function uploadFile() {
            const owner = document.getElementById('owner').value.trim();
            const repo = document.getElementById('repo').value.trim();
            const token = document.getElementById('token').value.trim();
            const folder = document.getElementById('folder').value.trim();
            let newName = document.getElementById('newName').value.trim();

            const status = document.getElementById('status');
            const btn = document.getElementById('uploadBtn');

            if (!owner || !repo || !token || !selectedFile) {
                status.innerHTML = '<span class="text-red-400">Please fill all fields and select a file.</span>';
                return;
            }
            if (!newName) newName = selectedFile.name;

            btn.disabled = true;
            status.innerHTML = '<span class="text-cyan-400">Reading file...</span>';

            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64 = e.target.result.split(',')[1];
                const path = folder ? `${folder}/${newName}` : newName;

                status.innerHTML = '<span class="text-cyan-400">Uploading to GitHub...</span>';

                try {
                    const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${token}`,
                            'Accept': 'application/vnd.github+json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: `Upload ${newName}`,
                            content: base64,
                            branch: 'main'  // Change to 'master' if needed
                        })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        status.innerHTML = `✅ <a href="${data.content.html_url}" target="_blank" class="underline text-green-400">File uploaded successfully!</a>`;
                    } else {
                        const err = await response.json();
                        status.innerHTML = `<span class="text-red-400">Error: ${err.message}</span>`;
                    }
                } catch (err) {
                    status.innerHTML = `<span class="text-red-400">Upload failed: ${err.message}</span>`;
                } finally {
                    btn.disabled = false;
                }
            };
            reader.readAsDataURL(selectedFile);
        }

        // Load saved values from localStorage
        window.onload = () => {
            document.getElementById('owner').value = localStorage.getItem('gh_owner') || '';
            document.getElementById('repo').value = localStorage.getItem('gh_repo') || '';
            document.getElementById('folder').value = localStorage.getItem('gh_folder') || '';
            
            // Auto-save on change
            ['owner','repo','folder'].forEach(id => {
                document.getElementById(id).addEventListener('change', () => {
                    localStorage.setItem('gh_' + id, document.getElementById(id).value);
                });
            });
        };
    </script>
</body>
</html>
