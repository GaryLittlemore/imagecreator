<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Renamer & Exporter</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            padding: 40px;
            display: flex;
            justify-content: center;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 450px;
            width: 100%;
        }
        h2 { margin-top: 0; color: #333; }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        input[type="text"], select, input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0076ff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #0056b3; }
        #preview {
            margin-top: 15px;
            max-width: 100%;
            border-radius: 6px;
            display: none;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Image Packer</h2>
    
    <div class="form-group">
        <label for="folderSelect">Target Destination Folder:</label>
        <select id="folderSelect">
            <option value="assets/images/cards/">assets/images/cards/</option>
            <option value="assets/images/badges/">assets/images/badges/</option>
            <option value="uploads/">uploads/</option>
        </select>
    </div>

    <div class="form-group">
        <label for="imageInput">Choose Image:</label>
        <input type="file" id="imageInput" accept="image/*">
        <img id="preview" alt="Image preview">
    </div>

    <div class="form-group">
        <label for="fileNameInput">New File Name (without extension):</label>
        <input type="text" id="fileNameInput" placeholder="e.g., player_card_01">
    </div>

    <button id="downloadBtn">Prepare & Download File</button>
</div>

<script>
    const imageInput = document.getElementById('imageInput');
    const fileNameInput = document.getElementById('fileNameInput');
    const folderSelect = document.getElementById('folderSelect');
    const downloadBtn = document.getElementById('downloadBtn');
    const preview = document.getElementById('preview');

    let fileExtension = '.png'; 

    // Show preview and auto-fill original name as a baseline
    imageInput.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            // Get extension
            fileExtension = file.name.substring(file.name.lastIndexOf('.'));
            
            // Strip extension for the textbox suggestion
            const justName = file.name.substring(0, file.name.lastIndexOf('.'));
            fileNameInput.value = justName;

            // Show preview
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
            }
            reader.readAsDataURL(file);
        }
    });

    // Handle the "Upload"/Download simulation
    downloadBtn.addEventListener('click', () => {
        const file = imageInput.files[0];
        if (!file) {
            alert('Please select an image first!');
            return;
        }

        const chosenFolder = folderSelect.value;
        const chosenName = fileNameInput.value.trim() || 'unnamed';
        
        // Combine them into a full virtual path string
        const fullVirtualPath = `${chosenFolder}${chosenName}${fileExtension}`;
        
        // Generate a download link
        const blobUrl = URL.createObjectURL(file);
        const link = document.createElement('a');
        link.href = blobUrl;
        
        // Note: Browsers will save this to the user's local Downloads folder, 
        // but the filename parameter passes the structured name string.
        link.download = `${chosenName}${fileExtension}`;
        
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        
        console.log(`File virtually assigned to target path: ${fullVirtualPath}`);
        alert(`File ready! Saving as: ${chosenName}${fileExtension}\nTarget structural path intended: ${chosenFolder}`);
    });
</script>

</body>
</html>
