<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Image Creator Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:#0f172a;
    color:white;
    padding:30px;
}

.container{
    max-width:1400px;
    margin:auto;
}

h1{
    font-size:42px;
    font-weight:800;
    margin-bottom:10px;
}

.subtitle{
    color:#cbd5e1;
    margin-bottom:30px;
}

.layout{
    display:grid;
    grid-template-columns:380px 1fr;
    gap:30px;
}

.controls{
    background:#111827;
    border-radius:20px;
    padding:25px;
    border:1px solid #1e293b;
    height:fit-content;
}

.control-group{
    margin-bottom:22px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
}

input[type="text"]{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #334155;
    background:#0f172a;
    color:white;
    font-size:15px;
}

input[type="file"]{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:1px dashed #475569;
    background:#0f172a;
    color:#cbd5e1;
}

.button-row{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-top:15px;
}

button{
    flex:1;
    min-width:140px;
    padding:14px;
    border:none;
    border-radius:14px;
    cursor:pointer;
    font-weight:700;
    font-size:15px;
    transition:0.2s;
}

.generate-btn{
    background:#2563eb;
    color:white;
}

.generate-btn:hover{
    background:#1d4ed8;
}

.download-btn{
    background:#10b981;
    color:white;
}

.download-btn:hover{
    background:#059669;
}

.preview{
    display:flex;
    justify-content:center;
    align-items:flex-start;
}

.canvas-wrap{
    background:#111827;
    padding:20px;
    border-radius:20px;
    border:1px solid #1e293b;
}

canvas{
    width:100%;
    max-width:700px;
    aspect-ratio:1/1;
    background:black;
    border-radius:18px;
    display:block;
}

.note{
    margin-top:18px;
    color:#94a3b8;
    font-size:13px;
    line-height:1.5;
}

@media(max-width:1000px){

    .layout{
        grid-template-columns:1fr;
    }

}
</style>
</head>

<body>

<div class="container">

    <h1>Image Creator Pro</h1>

    <div class="subtitle">
        Create Instagram-ready football graphics directly in your browser.
    </div>

    <div class="layout">

        <div class="controls">

            <div class="control-group">
                <label>Player Image</label>
                <input type="file" id="playerImage" accept="image/*">
            </div>

            <div class="control-group">
                <label>Club Badge</label>
                <input type="file" id="clubBadge" accept="image/*">
            </div>

            <div class="control-group">
                <label>Player Name</label>
                <input type="text" id="playerName" placeholder="Player Name">
            </div>

            <div class="control-group">
                <label>Club Name</label>
                <input type="text" id="clubName" placeholder="Club Name">
            </div>

            <div class="control-group">
                <label>Player Sponsor</label>
                <input type="text" id="playerSponsor" placeholder="Sponsored by...">
            </div>

            <div class="button-row">
                <button class="generate-btn" id="generateBtn">
                    Generate Image
                </button>

                <button class="download-btn" id="downloadBtn">
                    Download PNG
                </button>
            </div>

            <div class="note">
                Output size: 1080 × 1080<br>
                Perfect for Instagram posts and GitHub Pages hosting.
            </div>

        </div>

        <div class="preview">

            <div class="canvas-wrap">
                <canvas id="canvas" width="1080" height="1080"></canvas>
            </div>

        </div>

    </div>

</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const playerInput = document.getElementById('playerImage');
const badgeInput = document.getElementById('clubBadge');

const playerNameInput = document.getElementById('playerName');
const clubNameInput = document.getElementById('clubName');
const sponsorInput = document.getElementById('playerSponsor');

let playerImg = null;
let badgeImg = null;

function loadImage(file, callback){

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(event){

        const img = new Image();

        img.onload = function(){
            callback(img);
        };

        img.src = event.target.result;
    };

    reader.readAsDataURL(file);
}

playerInput.addEventListener('change', function(e){

    loadImage(e.target.files[0], function(img){

        playerImg = img;
        generateImage();
    });

});

badgeInput.addEventListener('change', function(e){

    loadImage(e.target.files[0], function(img){

        badgeImg = img;
        generateImage();
    });

});

function drawBackground(){

    const gradient = ctx.createLinearGradient(0,0,1080,1080);

    gradient.addColorStop(0, '#0f172a');
    gradient.addColorStop(1, '#2563eb');

    ctx.fillStyle = gradient;
    ctx.fillRect(0,0,1080,1080);
}

function drawPlayerImage(){

    if(!playerImg) return;

    const targetX = 140;
    const targetY = 145;
    const targetWidth = 800;
    const targetHeight = 680;

    const imgRatio = playerImg.width / playerImg.height;
    const targetRatio = targetWidth / targetHeight;

    let sx, sy, sWidth, sHeight;

    if(imgRatio > targetRatio){

        sHeight = playerImg.height;
        sWidth = sHeight * targetRatio;

        sx = (playerImg.width - sWidth) / 2;
        sy = 0;

    } else {

        sWidth = playerImg.width;
        sHeight = sWidth / targetRatio;

        sx = 0;
        sy = (playerImg.height - sHeight) / 2;
    }

    ctx.drawImage(
        playerImg,
        sx,
        sy,
        sWidth,
        sHeight,
        targetX,
        targetY,
        targetWidth,
        targetHeight
    );
}

function drawBadge(){

    if(!badgeImg) return;

    /*
        BADGE MOVED TO LOWER PANEL
        LEFT INDENT + CENTERED
    */

    const badgeSize = 110;
    const badgeX = 40;
    const badgeY = 890;

    ctx.save();

    ctx.beginPath();
    ctx.arc(
        badgeX + (badgeSize / 2),
        badgeY + (badgeSize / 2),
        badgeSize / 2,
        0,
        Math.PI * 2
    );

    ctx.closePath();
    ctx.clip();

    ctx.drawImage(
        badgeImg,
        badgeX,
        badgeY,
        badgeSize,
        badgeSize
    );

    ctx.restore();

    ctx.strokeStyle = 'white';
    ctx.lineWidth = 5;

    ctx.beginPath();

    ctx.arc(
        badgeX + (badgeSize / 2),
        badgeY + (badgeSize / 2),
        badgeSize / 2,
        0,
        Math.PI * 2
    );

    ctx.stroke();
}

function drawText(){

    const playerName =
        playerNameInput.value || 'Player Name';

    const clubName =
        clubNameInput.value || 'Club Name';

    const sponsor =
        sponsorInput.value || 'Sponsored by...';

    /*
        TOP CLUB NAME BAR
    */

    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0,0,1080,110);

    /*
        CLUB NAME
    */

    ctx.fillStyle = '#ffffff';
    ctx.font = '800 54px Inter';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.fillText(
        clubName,
        540,
        55
    );

    /*
        LOWER PANEL
    */

    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0,860,1080,170);

    /*
        PLAYER NAME
    */

    ctx.fillStyle = '#ffffff';
    ctx.font = '800 72px Inter';
    ctx.textAlign = 'center';

    ctx.fillText(
        playerName,
        590,
        930
    );

    /*
        SPONSOR
    */

    ctx.font = '600 30px Inter';

    ctx.fillText(
        sponsor,
        590,
        1000
    );
}

function generateImage(){

    ctx.clearRect(0,0,1080,1080);

    drawBackground();
    drawPlayerImage();
    drawText();
    drawBadge();
}

document.getElementById('generateBtn').addEventListener('click', generateImage);

document.getElementById('downloadBtn').addEventListener('click', function(){

    generateImage();

    const link = document.createElement('a');

    const filename =
        (playerNameInput.value || 'image-creator-pro')
        .replace(/\s+/g,'-')
        .toLowerCase();

    link.download = filename + '.png';

    link.href = canvas.toDataURL('image/png');

    link.click();
});

generateImage();
</script>

</body>
</html>
