<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Image Creator Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:#111827;
    color:#fff;
    min-height:100vh;
    padding:30px;
}

.container{
    max-width:1400px;
    margin:auto;
}

h1{
    font-size:42px;
    font-weight:800;
    margin-bottom:10px;
}

.subtitle{
    color:#cbd5e1;
    margin-bottom:30px;
}

.layout{
    display:grid;
    grid-template-columns:380px 1fr;
    gap:30px;
}

.controls{
    background:#1f2937;
    border-radius:20px;
    padding:25px;
    border:1px solid #374151;
    height:fit-content;
}

.control-group{
    margin-bottom:22px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    font-size:14px;
}

input[type="text"]{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:none;
    background:#111827;
    color:white;
    font-size:15px;
    border:1px solid #374151;
}

input[type="file"]{
    width:100%;
    background:#111827;
    border:1px dashed #4b5563;
    padding:12px;
    border-radius:12px;
    color:#d1d5db;
}

.button-row{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-top:10px;
}

button{
    flex:1;
    min-width:140px;
    padding:14px 18px;
    border:none;
    border-radius:14px;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    transition:0.2s ease;
}

.generate-btn{
    background:#2563eb;
    color:white;
}

.generate-btn:hover{
    background:#1d4ed8;
}

.download-btn{
    background:#10b981;
    color:white;
}

.download-btn:hover{
    background:#059669;
}

.preview-area{
    display:flex;
    justify-content:center;
    align-items:flex-start;
}

.canvas-wrapper{
    background:#1f2937;
    border-radius:24px;
    padding:20px;
    border:1px solid #374151;
    width:fit-content;
}

canvas{
    width:100%;
    max-width:700px;
    aspect-ratio:1 / 1;
    border-radius:20px;
    background:#000;
}

.note{
    margin-top:18px;
    color:#94a3b8;
    font-size:13px;
    line-height:1.5;
}

@media(max-width:1000px){

    .layout{
        grid-template-columns:1fr;
    }

    h1{
        font-size:34px;
    }

    .preview-area{
        justify-content:center;
    }

}
</style>
</head>

<body>

<div class="container">

    <h1>Image Creator Pro</h1>
    <div class="subtitle">
        Create Instagram-ready football player graphics directly in your browser.
    </div>

    <div class="layout">

        <div class="controls">

            <div class="control-group">
                <label>Player Image</label>
                <input type="file" id="playerImage" accept="image/*">
            </div>

            <div class="control-group">
                <label>Club Badge</label>
                <input type="file" id="clubBadge" accept="image/*">
            </div>

            <div class="control-group">
                <label>Player Name</label>
                <input type="text" id="playerName" placeholder="e.g. John Smith">
            </div>

            <div class="control-group">
                <label>Club Name</label>
                <input type="text" id="clubName" placeholder="e.g. Runcorn Town FC">
            </div>

            <div class="control-group">
                <label>Player Sponsor</label>
                <input type="text" id="playerSponsor" placeholder="e.g. Sponsored by ABC Ltd">
            </div>

            <div class="button-row">
                <button class="generate-btn" id="generateBtn">
                    Generate Image
                </button>

                <button class="download-btn" id="downloadBtn">
                    Download PNG
                </button>
            </div>

            <div class="note">
                Instagram-ready square format (1080×1080).<br>
                Works perfectly on GitHub Pages with no backend required.
            </div>

        </div>

        <div class="preview-area">

            <div class="canvas-wrapper">
                <canvas id="canvas" width="1080" height="1080"></canvas>
            </div>

        </div>

    </div>

</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const playerInput = document.getElementById('playerImage');
const badgeInput = document.getElementById('clubBadge');

const playerNameInput = document.getElementById('playerName');
const clubNameInput = document.getElementById('clubName');
const sponsorInput = document.getElementById('playerSponsor');

const generateBtn = document.getElementById('generateBtn');
const downloadBtn = document.getElementById('downloadBtn');

let playerImage = null;
let badgeImage = null;

function loadImage(file, callback){
    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(e){
        const img = new Image();

        img.onload = function(){
            callback(img);
        };

        img.src = e.target.result;
    };

    reader.readAsDataURL(file);
}

playerInput.addEventListener('change', (e)=>{
    loadImage(e.target.files[0], (img)=>{
        playerImage = img;
    });
});

badgeInput.addEventListener('change', (e)=>{
    loadImage(e.target.files[0], (img)=>{
        badgeImage = img;
    });
});

function drawBackground(){
    const gradient = ctx.createLinearGradient(0,0,1080,1080);

    gradient.addColorStop(0, '#0f172a');
    gradient.addColorStop(1, '#1d4ed8');

    ctx.fillStyle = gradient;
    ctx.fillRect(0,0,1080,1080);

    // Decorative circles
    ctx.globalAlpha = 0.15;

    ctx.beginPath();
    ctx.arc(900,180,200,0,Math.PI*2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(150,950,250,0,Math.PI*2);
    ctx.fill();

    ctx.globalAlpha = 1;
}

function drawPlayer(){
    if(!playerImage) return;

    const maxWidth = 760;
    const maxHeight = 820;

    let width = playerImage.width;
    let height = playerImage.height;

    const scale = Math.min(maxWidth / width, maxHeight / height);

    width *= scale;
    height *= scale;

    const x = (1080 - width) / 2;
    const y = 150;

    ctx.drawImage(playerImage, x, y, width, height);
}

function drawBadge(){
    if(!badgeImage) return;

    ctx.save();

    ctx.beginPath();
    ctx.arc(150,150,75,0,Math.PI*2);
    ctx.closePath();
    ctx.clip();

    ctx.drawImage(badgeImage,75,75,150,150);

    ctx.restore();

    ctx.lineWidth = 8;
    ctx.strokeStyle = 'white';

    ctx.beginPath();
    ctx.arc(150,150,75,0,Math.PI*2);
    ctx.stroke();
}

function drawText(){
    const playerName = playerNameInput.value || 'PLAYER NAME';
    const clubName = clubNameInput.value || 'CLUB NAME';
    const sponsor = sponsorInput.value || 'Sponsored by...';

    // Bottom overlay
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0,780,1080,300);

    // Club name
    ctx.fillStyle = '#93c5fd';
    ctx.font = 'bold 42px Inter';
    ctx.textAlign = 'center';
    ctx.fillText(clubName.toUpperCase(), 540, 860);

    // Player name
    ctx.fillStyle = '#ffffff';
    ctx.font = '800 82px Inter';
    ctx.fillText(playerName.toUpperCase(), 540, 940);

    // Sponsor box
    ctx.fillStyle = '#ffffff';
    ctx.roundRect(240,980,600,58,16);
    ctx.fill();

    ctx.fillStyle = '#111827';
    ctx.font = '600 30px Inter';
    ctx.fillText(sponsor, 540, 1018);
}

function generateImage(){

    ctx.clearRect(0,0,1080,1080);

    drawBackground();
    drawPlayer();
    drawBadge();
    drawText();
}

generateBtn.addEventListener('click', generateImage);

downloadBtn.addEventListener('click', ()=>{

    generateImage();

    const link = document.createElement('a');

    const filename =
        (playerNameInput.value || 'image-creator-pro')
        .replace(/\s+/g,'-')
        .toLowerCase();

    link.download = filename + '.png';
    link.href = canvas.toDataURL('image/png');

    link.click();
});

// Initial placeholder render
generateImage();
</script>

</body>
</html>
