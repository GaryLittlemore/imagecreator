<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sports Card Creator</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f1f5f9;
    font-family:Arial,sans-serif;
    padding:20px;
    max-width:1200px;
    margin:auto;
}

.panel{
    background:#fff;
    padding:20px;
    border-radius:14px;
    margin-bottom:20px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

h1{
    margin-bottom:20px;
    font-size:32px;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

input,
textarea,
button{
    width:100%;
    padding:12px;
    margin-bottom:14px;
    border-radius:10px;
    border:1px solid #cbd5e1;
    font-size:16px;
}

textarea{
    resize:vertical;
}

button{
    border:none;
    background:#2563eb;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

canvas{
    width:100%;
    max-width:100%;
    border-radius:20px;
    box-shadow:0 6px 20px rgba(0,0,0,.15);
    display:block;
}

@media(max-width:700px){

    .row{
        grid-template-columns:1fr;
    }

}

</style>
</head>
<body>

<div class="panel">

<h1>Sports Card Creator</h1>

<div class="row">

<div>
<label>Player Name</label>
<input type="text" id="playerName" value="John Smith">
</div>

<div>
<label>Team Name</label>
<input type="text" id="teamName" value="Runcorn Town">
</div>

</div>

<label>Sponsored By</label>
<textarea id="playerText" rows="3">Company Name</textarea>

<label>Player Photo</label>
<input type="file" id="playerPhoto" accept="image/*">

<label>Team Badge / Logo</label>
<input type="file" id="teamLogo" accept="image/*">

<button onclick="generateCard()">Generate Card</button>
<button onclick="downloadCard()">Download PNG</button>

</div>

<canvas id="card" width="1080" height="1350"></canvas>

<script>

const canvas = document.getElementById('card');
const ctx = canvas.getContext('2d');

let playerImg = null;
let logoImg = null;

/* LOAD PLAYER IMAGE */

document.getElementById('playerPhoto').addEventListener('change', function(e){

    const file = e.target.files[0];

    if(!file) return;

    playerImg = new Image();

    playerImg.onload = generateCard;

    playerImg.src = URL.createObjectURL(file);

});

/* LOAD TEAM LOGO */

document.getElementById('teamLogo').addEventListener('change', function(e){

    const file = e.target.files[0];

    if(!file) return;

    logoImg = new Image();

    logoImg.onload = generateCard;

    logoImg.src = URL.createObjectURL(file);

});

/* AUTO FIT TEXT */

function fitText(text,maxWidth,startSize){

    let size = startSize;

    while(size > 20){

        ctx.font = `bold ${size}px Arial`;

        if(ctx.measureText(text).width <= maxWidth){
            return size;
        }

        size--;

    }

    return 20;
}

/* WRAP TEXT */

function wrapText(text,x,y,maxWidth,lineHeight){

    const words = text.split(' ');

    let line = '';

    for(let i = 0; i < words.length; i++){

        const testLine = line + words[i] + ' ';
        const width = ctx.measureText(testLine).width;

        if(width > maxWidth && i > 0){

            ctx.fillText(line,x,y);

            line = words[i] + ' ';
            y += lineHeight;

        }else{

            line = testLine;

        }

    }

    ctx.fillText(line,x,y);

}

/* MAIN CARD */

function generateCard(){

    const player = document.getElementById('playerName').value;
    const team = document.getElementById('teamName').value;
    const sponsor = document.getElementById('playerText').value;

    ctx.clearRect(0,0,1080,1350);

    /* BACKGROUND */

    const gradient = ctx.createLinearGradient(0,0,1080,1350);

    gradient.addColorStop(0,'#0f172a');
    gradient.addColorStop(1,'#1d4ed8');

    ctx.fillStyle = gradient;
    ctx.fillRect(0,0,1080,1350);

    /* DECORATION */

    ctx.fillStyle = 'rgba(255,255,255,.08)';

    ctx.beginPath();
    ctx.arc(920,220,260,0,Math.PI * 2);
    ctx.fill();

    /* TEAM NAME */

    const teamSize = fitText(team,900,56);

    ctx.font = `bold ${teamSize}px Arial`;
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';

    ctx.shadowColor = 'rgba(0,0,0,.4)';
    ctx.shadowBlur = 8;

    ctx.fillText(team,540,90);

    ctx.shadowBlur = 0;
    ctx.textAlign = 'left';

    /* PLAYER IMAGE */

    ctx.save();

    ctx.beginPath();
    ctx.roundRect(80,150,920,760,30);
    ctx.clip();

    if(playerImg){

        ctx.drawImage(playerImg,80,150,920,760);

    }else{

        ctx.fillStyle = 'rgba(255,255,255,.15)';
        ctx.fillRect(80,150,920,760);

    }

    ctx.restore();

    /* PLAYER NAME TAG */

    const playerSize = fitText(player,700,72);

    ctx.font = `bold ${playerSize}px Arial`;

    const textWidth = ctx.measureText(player).width;

    const paddingX = 34;
    const paddingY = 22;

    const tagWidth = textWidth + (paddingX * 2);
    const tagHeight = playerSize + paddingY;

    const tagX = 80;
    const tagY = 790;

    ctx.fillStyle = 'rgba(0,0,0,.65)';

    ctx.beginPath();
    ctx.roundRect(tagX,tagY,tagWidth,tagHeight,20);
    ctx.fill();

    ctx.fillStyle = '#ffffff';

    ctx.fillText(
        player,
        tagX + paddingX,
        tagY + tagHeight - 18
    );

    /* TEAM LOGO */

    if(logoImg){

        ctx.drawImage(logoImg,850,980,150,150);

    }

    /* SPONSOR */

    ctx.fillStyle = '#ffffff';

    ctx.font = 'bold 42px Arial';
    ctx.fillText('Sponsored by',80,1020);

    ctx.font = '32px Arial';

    wrapText(sponsor,80,1080,760,42);

    /* BORDER */

    ctx.strokeStyle = 'rgba(255,255,255,.25)';
    ctx.lineWidth = 4;

    ctx.strokeRect(25,25,1030,1300);

}

/* DOWNLOAD */

function downloadCard(){

    const link = document.createElement('a');

    link.download = 'sports-card.png';

    link.href = canvas.toDataURL('image/png');

    link.click();

}

/* INITIAL RENDER */

generateCard();

</script>

</body>
</html>
