<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Creator Pro</title>

<style>
*{
    box-sizing:border-box;
}

body{
    font-family:Inter,Arial,sans-serif;
    max-width:1200px;
    margin:20px auto;
    padding:20px;
    background:#f3f4f6;
    color:#111827;
}

.panel{
    background:white;
    padding:24px;
    border-radius:16px;
    margin-bottom:20px;
    box-shadow:0 4px 16px rgba(0,0,0,.08);
}

h1{
    margin-bottom:20px;
    font-size:32px;
}

label{
    display:block;
    font-weight:600;
    margin-top:10px;
    margin-bottom:6px;
}

input,
textarea,
button{
    width:100%;
    padding:12px;
    margin-bottom:12px;
    border-radius:10px;
    border:1px solid #d1d5db;
    font-size:16px;
}

textarea{
    resize:vertical;
}

button{
    border:none;
    background:#2563eb;
    color:white;
    font-weight:600;
    transition:.2s;
}

button:hover{
    background:#1d4ed8;
}

canvas{
    width:100%;
    max-width:100%;
    border-radius:20px;
    box-shadow:0 6px 24px rgba(0,0,0,.18);
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

@media(max-width:768px){
    .row{
        grid-template-columns:1fr;
    }
}
</style>
</head>
<body>

<div class="panel">

<h1>Image Creator Pro</h1>

<div class="row">

<div>
<label>Player Name</label>
<input id="playerName" value="John Smith">
</div>

<div>
<label>Team Name</label>
<input id="teamName" value="Runcorn Town">
</div>

</div>

<label>Sponsored by</label>
<textarea id="playerText" rows="4">Company Name</textarea>

<label>Player Photo</label>
<input type="file" id="playerPhoto" accept="image/*">

<label>Team Badge / Logo</label>
<input type="file" id="teamLogo" accept="image/*">

<button onclick="generateCard()">Generate Card</button>
<button onclick="downloadCard()">Download PNG</button>

</div>

<canvas id="card" width="1080" height="1350"></canvas>

<script>
const canvas = document.getElementById('card');
const ctx = canvas.getContext('2d');

let playerImg = null;
let logoImg = null;

/* LOAD PLAYER IMAGE */

document.getElementById('playerPhoto').addEventListener('change', e => {

    const file = e.target.files[0];

    if(!file) return;

    playerImg = new Image();

    playerImg.onload = generateCard;

    playerImg.src = URL.createObjectURL(file);

});

/* LOAD TEAM LOGO */

document.getElementById('teamLogo').addEventListener('change', e => {

    const file = e.target.files[0];

    if(!file) return;

    logoImg = new Image();

    logoImg.onload = generateCard;

    logoImg.src = URL.createObjectURL(file);

});

/* FIT TEXT */

function fitText(text,maxWidth,startSize,weight='700'){

    let size = startSize;

    while(size > 20){

        ctx.font = `${weight} ${size}px Inter, Arial`;

        if(ctx.measureText(text).width <= maxWidth){
            return size;
        }

        size--;
    }

    return 20;
}

/* WRAP TEXT */

function wrapText(text,x,y,maxWidth,lineHeight){

    const words = text.split(' ');

    let line = '';

    for(let i = 0; i < words.length; i++){

        const test = line + words[i] + ' ';

        if(ctx.measureText(test).width > maxWidth && i > 0){

            ctx.fillText(line,x,y);

            line = words[i] + ' ';

            y += lineHeight;

        }else{

            line = test;

        }
    }

    ctx.fillText(line,x,y);
}

/* GENERATE CARD */

function generateCard(){

    const player = document.getElementById('playerName').value;
    const team = document.getElementById('teamName').value;
    const bio = document.getElementById('playerText').value;

    ctx.clearRect(0,0,1080,1350);

    /* BACKGROUND */

    const grad = ctx.createLinearGradient(0,0,1080,1350);

    grad.addColorStop(0,'#0f172a');
    grad.addColorStop(1,'#1d4ed8');

    ctx.fillStyle = grad;
    ctx.fillRect(0,0,1080,1350);

    /* DECORATION */

    ctx.fillStyle = 'rgba(255,255,255,.08)';

    ctx.beginPath();
    ctx.arc(900,250,300,0,Math.PI * 2);
    ctx.fill();

    /* TEAM NAME */

    const teamSize = fitText(team,900,54);

    ctx.fillStyle = '#ffffff';
    ctx.font = `700 ${teamSize}px Inter, Arial`;

    ctx.textAlign = 'center';

    ctx.shadowColor = 'rgba(0,0,0,0.45)';
    ctx.shadowBlur = 10;
    ctx.shadowOffsetY = 3;

    ctx.fillText(team,540,88);

    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;

    ctx.textAlign = 'left';

    /* PLAYER IMAGE */

    if(playerImg){

        ctx.save();

        ctx.beginPath();
        ctx.roundRect(80,150,920,760,34);
        ctx.clip();

        ctx.drawImage(playerImg,80,150,920,760);

        ctx.restore();

    }else{

        ctx.fillStyle = 'rgba(255,255,255,.15)';

        ctx.beginPath();
        ctx.roundRect(80,150,920,760,34);

        ctx.fill();
    }

    /* PLAYER NAME TAG */

    let size = fitText(player,760,72);

    ctx.font = `700 ${size}px Inter, Arial`;

    const textMetrics = ctx.measureText(player);

    const textWidth = textMetrics.width;

    const paddingX = 34;
    const paddingY = 22;

    const boxWidth = textWidth + (paddingX * 2);
    const boxHeight = size + (paddingY * 1.5);

    const boxX = 80;
    const boxY = 790;

    ctx.fillStyle = 'rgba(0,0,0,.60)';

    ctx.beginPath();
    ctx.roundRect(boxX, boxY, boxWidth, boxHeight, 22);

    ctx.fill();

    ctx.fillStyle = '#ffffff';

    ctx.shadowColor = 'rgba(0,0,0,0.4)';
    ctx.shadowBlur = 8;
    ctx.shadowOffsetY = 2;

    ctx.fillText(
        player,
        boxX + paddingX,
        boxY + boxHeight - 18
    );

    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;

    /* TEAM LOGO */

    if(logoImg){

        ctx.save();

        ctx.beginPath();
        ctx.roundRect(850,980,150,150,24);
        ctx.clip();

        ctx.drawImage(logoImg,850,980,150,150);

        ctx.restore();
    }

    /* SPONSOR SECTION */

    ctx.fillStyle = 'white';

    ctx.font = '700 44px Inter, Arial';
    ctx.fillText('Sponsored by',80,1010);

    ctx.font = '32px Inter, Arial';

    wrapText(bio,80,1080,800,42);

    /* BORDER */

    ctx.strokeStyle = 'rgba(255,255,255,.25)';
    ctx.lineWidth = 4;

    ctx.strokeRect(25,25,1030,1300);
}

/* DOWNLOAD */

function downloadCard(){

    const link = document.createElement('a');

    link.download = 'sports-card.png';

    link.href = canvas.toDataURL('image/png');

    link.click();
}

/* INITIAL RENDER */

generateCard();
</script>

</body>
</html>
