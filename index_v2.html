<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Image Creator Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:#0f172a;
    color:white;
    padding:30px;
}

.container{
    max-width:1400px;
    margin:auto;
}

h1{
    font-size:42px;
    font-weight:800;
    margin-bottom:10px;
}

.subtitle{
    color:#cbd5e1;
    margin-bottom:30px;
}

.layout{
    display:grid;
    grid-template-columns:380px 1fr;
    gap:30px;
}

.controls{
    background:#111827;
    border-radius:20px;
    padding:25px;
    border:1px solid #1e293b;
}

.control-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:600;
}

input, select{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #334155;
    background:#0f172a;
    color:white;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    margin-top:10px;
    font-weight:700;
    cursor:pointer;
}

.download-btn{
    background:#10b981;
}

canvas{
    width:100%;
    max-width:700px;
    aspect-ratio:1/1;
    border-radius:18px;
    background:black;
    display:block;
}
</style>
</head>

<body>

<div class="container">

<h1>Image Creator Pro</h1>
<div class="subtitle">Live football graphic builder</div>

<div class="layout">

<!-- CONTROLS -->
<div class="controls">

<div class="control-group">
<label>Player Image</label>
<input type="file" id="playerImage">
</div>

<div class="control-group">
<label>Club Badge</label>
<input type="file" id="clubBadge">
</div>

<div class="control-group">
<label>Player Name</label>
<input type="text" id="playerName">
</div>

<div class="control-group">
<label>Club Name</label>
<input type="text" id="clubName">
</div>

<div class="control-group">
<label>Sponsor</label>
<input type="text" id="sponsor">
</div>

<div class="control-group">
<label>Primary Colour</label>
<input type="color" id="c1" value="#0f172a">
</div>

<div class="control-group">
<label>Secondary Colour</label>
<input type="color" id="c2" value="#2563eb">
</div>

<button class="download-btn" id="downloadBtn">Download PNG</button>

</div>

<!-- CANVAS -->
<div>
<canvas id="canvas" width="1080" height="1080"></canvas>
</div>

</div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let playerImg=null;
let badgeImg=null;

let px=140, py=140;

function draw(){

const c1=document.getElementById("c1").value;
const c2=document.getElementById("c2").value;

const player=document.getElementById("playerName").value || "Player";
const club=document.getElementById("clubName").value || "Club";
const sponsor=document.getElementById("sponsor").value || "Sponsor";

const grad=ctx.createLinearGradient(0,0,1080,1080);
grad.addColorStop(0,c1);
grad.addColorStop(1,c2);

ctx.fillStyle=grad;
ctx.fillRect(0,0,1080,1080);

// TOP BAR
ctx.fillStyle="rgba(0,0,0,0.5)";
ctx.fillRect(0,0,1080,110);

ctx.fillStyle="#fff";
ctx.font="800 54px Inter";
ctx.textAlign="center";
ctx.fillText(club,540,60);

// PLAYER IMAGE
if(playerImg){
ctx.drawImage(playerImg,px,140,800,650);
}

// BOTTOM BAR
ctx.fillStyle="rgba(0,0,0,0.75)";
ctx.fillRect(0,860,1080,220);

// TEXT SHADOW
ctx.fillStyle="black";
ctx.font="800 72px Inter";
ctx.fillText(player,542,932);

ctx.fillStyle="#fff";
ctx.fillText(player,540,930);

ctx.font="600 30px Inter";
ctx.fillText(sponsor,540,1000);

// BADGE
if(badgeImg){
ctx.drawImage(badgeImg,40,880,120,120);
}

}

function load(file,cb){
const r=new FileReader();
r.onload=e=>{
const img=new Image();
img.onload=()=>cb(img);
img.src=e.target.result;
};
r.readAsDataURL(file);
}

document.getElementById("playerImage").onchange=e=>{
load(e.target.files[0],img=>{playerImg=img;draw();});
};

document.getElementById("clubBadge").onchange=e=>{
load(e.target.files[0],img=>{badgeImg=img;draw();});
};

document.querySelectorAll("input").forEach(i=>{
i.addEventListener("input",draw);
});

canvas.addEventListener("mousedown",e=>{
px=e.offsetX-400;
draw();
});

document.getElementById("downloadBtn").onclick=()=>{
draw();
const a=document.createElement("a");
a.download="graphic.png";
a.href=canvas.toDataURL();
a.click();
};

draw();
</script>

</body>
</html>
