<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Image Creator Pro - Next Level</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:Inter;
    background:#0f172a;
    color:white;
    padding:20px;
}

.container{
    display:grid;
    grid-template-columns:360px 1fr;
    gap:20px;
    max-width:1400px;
    margin:auto;
}

.panel{
    background:#111827;
    padding:18px;
    border-radius:14px;
}

input, select{
    width:100%;
    margin-bottom:10px;
    padding:10px;
    border-radius:10px;
    border:1px solid #334155;
    background:#0f172a;
    color:white;
}

label{
    font-size:13px;
    margin-top:8px;
    display:block;
    color:#cbd5e1;
}

canvas{
    width:100%;
    max-width:700px;
    border-radius:16px;
    background:black;
    display:block;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    margin-top:10px;
    font-weight:700;
    cursor:pointer;
}

.download{
    background:#10b981;
    color:white;
}
.reset{
    background:#2563eb;
    color:white;
}
</style>
</head>

<body>

<div class="container">

<!-- CONTROLS -->
<div class="panel">

<h2>Image Creator Pro</h2>

<label>Template</label>
<select id="template">
<option value="matchday">Matchday</option>
<option value="transfer">Transfer</option>
<option value="goal">Goal Scorer</option>
</select>

<label>Format</label>
<select id="format">
<option value="square">Instagram 1:1</option>
<option value="story">Story 9:16</option>
</select>

<label>Player Image</label>
<input type="file" id="playerImg">

<label>Club Badge</label>
<input type="file" id="badgeImg">

<label>Player Name</label>
<input id="playerName">

<label>Club Name</label>
<input id="clubName">

<label>Sponsor</label>
<input id="sponsor">

<label>Zoom</label>
<input type="range" id="zoom" min="0.5" max="2" step="0.01" value="1">

<label>Rotate</label>
<input type="range" id="rotate" min="-20" max="20" value="0">

<button class="reset" onclick="resetPlayer()">Reset Position</button>
<button class="download" onclick="download()">Download PNG</button>

</div>

<!-- CANVAS -->
<div>
<canvas id="c" width="1080" height="1080"></canvas>
</div>

</div>

<script>

const c=document.getElementById("c");
const ctx=c.getContext("2d");

let img=null;
let badge=null;

let x=150,y=150;
let dragging=false;

let zoom=1;
let rot=0;

function draw(){

const template=document.getElementById("template").value;

const g=ctx.createLinearGradient(0,0,c.width,c.height);

if(template==="matchday"){
g.addColorStop(0,"#0f172a");
g.addColorStop(1,"#2563eb");
}
if(template==="transfer"){
g.addColorStop(0,"#111827");
g.addColorStop(1,"#dc2626");
}
if(template==="goal"){
g.addColorStop(0,"#000");
g.addColorStop(1,"#f59e0b");
}

ctx.fillStyle=g;
ctx.fillRect(0,0,c.width,c.height);

// TEXT
ctx.fillStyle="#fff";
ctx.font="800 60px Inter";
ctx.textAlign="center";

ctx.fillText(document.getElementById("clubName").value||"CLUB",540,70);

// IMAGE
if(img){
ctx.save();
ctx.translate(x+300,y+300);
ctx.rotate(rot*Math.PI/180);

ctx.drawImage(img,-300*zoom,-250*zoom,600*zoom,500*zoom);

ctx.restore();
}

// BOTTOM
ctx.fillStyle="rgba(0,0,0,0.6)";
ctx.fillRect(0,850,c.width,230);

ctx.font="800 70px Inter";
ctx.fillText(document.getElementById("playerName").value||"PLAYER",540,930);

ctx.font="400 30px Inter";
ctx.fillText(document.getElementById("sponsor").value||"Sponsor",540,1000);

// BADGE
if(badge){
ctx.drawImage(badge,40,880,120,120);
}

}

function load(file,cb){
const r=new FileReader();
r.onload=e=>{
const i=new Image();
i.onload=()=>cb(i);
i.src=e.target.result;
};
r.readAsDataURL(file);
}

document.getElementById("playerImg").onchange=e=>{
load(e.target.files[0],i=>{img=i;draw();});
};

document.getElementById("badgeImg").onchange=e=>{
load(e.target.files[0],i=>{badge=i;draw();});
};

document.querySelectorAll("input,select").forEach(el=>{
el.addEventListener("input",()=>{
zoom=document.getElementById("zoom").value;
rot=document.getElementById("rotate").value;
draw();
});
});

// DRAGGING
c.onmousedown=e=>{
dragging=true;
};

c.onmouseup=e=>{
dragging=false;
};

c.onmousemove=e=>{
if(!dragging) return;
x=e.offsetX-300;
y=e.offsetY-250;
draw();
};

// TOUCH
c.ontouchmove=e=>{
const t=e.touches[0];
x=t.clientX-300;
y=t.clientY-250;
draw();
};

function resetPlayer(){
x=150;
y=150;
zoom=1;
rot=0;
draw();
}

function download(){
draw();
const a=document.createElement("a");
a.download="graphic.png";
a.href=c.toDataURL();
a.click();
}

draw();

</script>

</body>
</html>
