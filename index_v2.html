<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Image Creator Pro – Enhanced</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
    :root{
        --bg:#0f172a;
        --panel:#111827;
        --border:#334155;
        --accent:#10b981;
        --text:#fff;
        --sub:#cbd5e1;
    }

    body{
        margin:0;
        font-family:Inter, sans-serif;
        background:var(--bg);
        color:var(--text);
        padding:20px;
    }

    h2{
        margin-top:0;
        font-weight:800;
        text-align:center;
    }

    .container{
        display:flex;
        flex-wrap:wrap;
        gap:20px;
        max-width:1400px;
        margin:auto;
    }

    .panel{
        background:var(--panel);
        padding:20px;
        border-radius:16px;
        width:350px;
        flex-shrink:0;
    }

    label{
        display:block;
        margin-top:14px;
        font-size:14px;
        color:var(--sub);
        font-weight:600;
    }

    input, select{
        width:100%;
        padding:10px;
        border-radius:10px;
        border:1px solid var(--border);
        background:var(--bg);
        color:var(--text);
        margin-top:6px;
        font-size:14px;
    }

    input[type="range"]{
        cursor:pointer;
    }

    button{
        width:100%;
        padding:14px;
        border:none;
        border-radius:12px;
        margin-top:16px;
        font-weight:700;
        cursor:pointer;
        font-size:15px;
    }

    .download{
        background:var(--accent);
        color:white;
    }

    canvas{
        width:100%;
        max-width:900px;
        background:black;
        border-radius:20px;
        display:block;
        margin:auto;
    }

    /* Responsive */
    @media(max-width:900px){
        .panel{
            width:100%;
        }
    }
</style>
</head>

<body>

<div class="container">

    <div class="panel">
        <h2>Image Creator Pro</h2>

        <label>Player Image</label>
        <input type="file" id="player">

        <label>Club Badge</label>
        <input type="file" id="badge">

        <label>Player Name</label>
        <input type="text" id="playerName" placeholder="e.g. Lionel Messi">

        <label>Club Name</label>
        <input type="text" id="clubName" placeholder="e.g. Inter Miami">

        <label>Sponsor</label>
        <input type="text" id="sponsor" placeholder="e.g. Adidas">

        <label>Zoom</label>
        <input type="range" id="zoom" min="0.5" max="2" step="0.01" value="1">

        <button class="download" onclick="download()">Download PNG</button>
    </div>

    <canvas id="c" width="1080" height="1080"></canvas>

</div>

<script>
const c = document.getElementById("c");
const ctx = c.getContext("2d");

let img = null;
let badge = null;

let x = 240;
let y = 200;
let zoom = 1;
let dragging = false;

/* DRAW FUNCTION */
function draw(){
    ctx.clearRect(0,0,1080,1080);

    /* Background gradient */
    const g = ctx.createLinearGradient(0,0,1080,1080);
    g.addColorStop(0,"#0f172a");
    g.addColorStop(1,"#2563eb");
    ctx.fillStyle = g;
    ctx.fillRect(0,0,1080,1080);

    /* Top bar */
    ctx.fillStyle="rgba(0,0,0,0.5)";
    ctx.fillRect(0,0,1080,110);

    ctx.fillStyle="#fff";
    ctx.font="800 54px Inter";
    ctx.textAlign="center";
    ctx.fillText(
        document.getElementById("clubName").value || "CLUB NAME",
        540,60
    );

    /* Player image */
    if(img){
        ctx.drawImage(img,x,y,600*zoom,500*zoom);
    }

    /* Bottom bar */
    ctx.fillStyle="rgba(0,0,0,0.75)";
    ctx.fillRect(0,850,1080,230);

    ctx.fillStyle="#fff";
    ctx.font="800 72px Inter";
    ctx.fillText(
        document.getElementById("playerName").value || "PLAYER NAME",
        540,930
    );

    ctx.font="600 30px Inter";
    ctx.fillText(
        document.getElementById("sponsor").value || "SPONSOR",
        540,1000
    );

    /* Badge */
    if(badge){
        ctx.drawImage(badge,40,880,120,120);
    }
}

/* Load image helper */
function load(file,cb){
    const r=new FileReader();
    r.onload=e=>{
        const i=new Image();
        i.onload=()=>cb(i);
        i.src=e.target.result;
    };
    r.readAsDataURL(file);
}

/* Live text update */
document.querySelectorAll("input[type='text']").forEach(input=>{
    input.addEventListener("input", draw);
});

/* Zoom */
document.getElementById("zoom").oninput=e=>{
    zoom = e.target.value;
    draw();
};

/* Load player image */
document.getElementById("player").onchange=e=>{
    load(e.target.files[0],i=>{img=i;draw();});
};

/* Load badge */
document.getElementById("badge").onchange=e=>{
    load(e.target.files[0],i=>{badge=i;draw();});
};

/* Drag image */
c.onmousedown=()=> dragging=true;
c.onmouseup=()=> dragging=false;

c.onmousemove=e=>{
    if(!dragging || !img) return;
    x = e.offsetX - 300;
    y = e.offsetY - 250;
    draw();
};

/* Download */
function download(){
    draw();
    const a=document.createElement("a");
    a.download="graphic.png";
    a.href=c.toDataURL();
    a.click();
}

/* Init */
draw();
</script>

</body>
</html>
