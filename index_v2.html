<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Image Creator Pro — New File</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;background:#0f172a;color:#fff;padding:28px}
  .container{max-width:1200px;margin:0 auto}
  h1{font-size:40px;font-weight:800;margin-bottom:8px}
  .subtitle{color:#cbd5e1;margin-bottom:20px}
  .layout{display:grid;grid-template-columns:380px 1fr;gap:24px}
  .controls{background:#0b1220;border-radius:16px;padding:20px;border:1px solid #1e293b}
  .control-group{margin-bottom:16px}
  label{display:block;margin-bottom:8px;font-weight:600}
  input[type="text"], input[type="file"], .range{width:100%;padding:10px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff}
  .button-row{display:flex;gap:10px;margin-top:12px}
  button{flex:1;padding:12px;border-radius:12px;border:none;cursor:pointer;font-weight:700}
  .generate-btn{background:#2563eb;color:#fff}
  .download-btn{background:#10b981;color:#fff}
  .preview{display:flex;justify-content:center;align-items:flex-start}
  .canvas-wrap{background:#0b1220;padding:16px;border-radius:16px;border:1px solid #1e293b}
  canvas{width:100%;max-width:720px;aspect-ratio:1/1;border-radius:12px;background:#000;display:block}
  .note{margin-top:12px;color:#94a3b8;font-size:13px}
  .small{font-size:13px;color:#94a3b8}
  .error{color:#ff7b7b;margin-top:8px}
  .spinner{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,0.12);border-top-color:#fff;border-radius:50%;animation:spin .9s linear infinite;vertical-align:middle;margin-left:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(max-width:1000px){.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
  <h1>Image Creator Pro</h1>
  <div class="subtitle">Create football graphics directly in your browser</div>

  <div class="layout">
    <div class="controls" role="region" aria-label="Controls">
      <div class="control-group">
        <label for="playerImage">Player Image</label>
        <input id="playerImage" type="file" accept="image/*" aria-describedby="playerHelp">
        <div id="playerHelp" class="small">Drag to reposition; scroll to zoom; use Scale slider for fine control.</div>
      </div>

      <div class="control-group">
        <label for="clubBadge">Club Badge</label>
        <input id="clubBadge" type="file" accept="image/*">
      </div>

      <div class="control-group">
        <label for="playerName">Player Name</label>
        <input id="playerName" type="text" placeholder="Player Name" aria-label="Player Name">
      </div>

      <div class="control-group">
        <label for="clubName">Club Name</label>
        <input id="clubName" type="text" placeholder="Club Name" aria-label="Club Name">
      </div>

      <div class="control-group">
        <label for="playerSponsor">Player Sponsor</label>
        <input id="playerSponsor" type="text" placeholder="Sponsored by..." aria-label="Sponsor">
      </div>

      <div class="control-group">
        <label for="scale">Scale</label>
        <input id="scale" class="range" type="range" min="0.3" max="3" step="0.01" value="1" aria-label="Scale">
      </div>

      <div class="control-group">
        <label for="rotation">Rotation (degrees)</label>
        <input id="rotation" class="range" type="range" min="-45" max="45" step="0.5" value="0" aria-label="Rotation">
      </div>

      <div class="button-row">
        <button id="generateBtn" class="generate-btn" aria-label="Generate Image">Generate Image</button>
        <button id="downloadBtn" class="download-btn" aria-label="Download PNG">Download PNG</button>
      </div>

      <div id="status" class="note small" aria-live="polite">Output size: 1080 × 1080</div>
      <div id="error" class="error" role="alert" hidden></div>
    </div>

    <div class="preview">
      <div class="canvas-wrap" aria-hidden="false">
        <canvas id="canvas" width="1080" height="1080"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
/* Short helpers */
const $ = id => document.getElementById(id);
const canvas = $('canvas');
const ctx = canvas.getContext('2d', { alpha: false });

const playerInput = $('playerImage');
const badgeInput = $('clubBadge');
const playerNameInput = $('playerName');
const clubNameInput = $('clubName');
const sponsorInput = $('playerSponsor');
const scaleInput = $('scale');
const rotationInput = $('rotation');
const status = $('status');
const errorBox = $('error');

let playerImg = null;
let badgeImg = null;

/* Transform state for player image */
const playerState = {
  x: canvas.width / 2,
  y: canvas.height / 2,
  scale: 1,
  rotation: 0, // radians
  dragging: false,
  lastPointer: null,
  naturalW: 0,
  naturalH: 0
};

let needsRender = true;

/* Convert client coordinates to canvas coordinates (handles CSS scaling) */
function clientToCanvas(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: (clientX - rect.left) * scaleX,
    y: (clientY - rect.top) * scaleY
  };
}

/* Read file into Image */
async function fileToImage(file){
  if(!file) return null;
  if(!file.type.startsWith('image/')) throw new Error('Invalid file type');
  const dataUrl = await new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
  return await new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = dataUrl;
  });
}

/* Error helpers */
function showError(msg){
  errorBox.hidden = false;
  errorBox.textContent = msg;
}
function clearError(){
  errorBox.hidden = true;
  errorBox.textContent = '';
}

/* Player image loader: compute initial fit scale and sync slider */
playerInput.addEventListener('change', async (e) => {
  clearError();
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  try{
    status.innerHTML = 'Loading player image <span class="spinner" aria-hidden="true"></span>';
    const img = await fileToImage(f);
    playerImg = img;
    playerState.naturalW = img.width;
    playerState.naturalH = img.height;

    // Fit into target area (800x680) while preserving aspect ratio
    const targetW = 800;
    const targetH = 680;
    const fitScale = Math.min(targetW / img.width, targetH / img.height);
    playerState.scale = Math.max(0.3, fitScale * 1.05);
    scaleInput.value = playerState.scale.toFixed(2);

    // center image
    playerState.x = canvas.width / 2;
    playerState.y = canvas.height / 2;

    // reset rotation
    playerState.rotation = 0;
    rotationInput.value = 0;

    needsRender = true;
    status.textContent = 'Player image loaded';
  }catch(err){
    showError('Failed to load player image');
    console.error(err);
  }finally{
    setTimeout(()=>{ if(status.textContent.includes('Loading')) status.textContent = 'Output size: 1080 × 1080'; }, 700);
  }
});

/* Badge loader */
badgeInput.addEventListener('change', async (e) => {
  clearError();
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  try{
    status.innerHTML = 'Loading badge <span class="spinner" aria-hidden="true"></span>';
    badgeImg = await fileToImage(f);
    needsRender = true;
    status.textContent = 'Badge loaded';
  }catch(err){
    showError('Failed to load badge');
    console.error(err);
  }finally{
    setTimeout(()=>{ if(status.textContent.includes('Loading')) status.textContent = 'Output size: 1080 × 1080'; }, 700);
  }
});

/* Pointer interactions for dragging (use canvas coordinates) */
canvas.addEventListener('pointerdown', (e) => {
  if(!playerImg) return;
  canvas.setPointerCapture(e.pointerId);
  playerState.dragging = true;
  playerState.lastPointer = clientToCanvas(e.clientX, e.clientY);
});

canvas.addEventListener('pointermove', (e) => {
  if(!playerState.dragging || !playerState.lastPointer) return;
  const p = clientToCanvas(e.clientX, e.clientY);
  const dx = p.x - playerState.lastPointer.x;
  const dy = p.y - playerState.lastPointer.y;
  playerState.x += dx;
  playerState.y += dy;
  playerState.lastPointer = p;
  needsRender = true;
});

canvas.addEventListener('pointerup', (e) => {
  playerState.dragging = false;
  playerState.lastPointer = null;
  try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
});

/* Wheel zoom centered on pointer */
canvas.addEventListener('wheel', (e) => {
  if(!playerImg) return;
  e.preventDefault();
  const delta = -e.deltaY * 0.0015; // sensitivity
  const oldScale = playerState.scale;
  let newScale = Math.max(0.3, Math.min(3, oldScale * (1 + delta)));

  // Zoom toward pointer position
  const pointer = clientToCanvas(e.clientX, e.clientY);
  const vx = pointer.x - playerState.x;
  const vy = pointer.y - playerState.y;
  playerState.x -= vx * (newScale / oldScale - 1);
  playerState.y -= vy * (newScale / oldScale - 1);

  playerState.scale = newScale;
  scaleInput.value = playerState.scale.toFixed(2);
  needsRender = true;
}, { passive: false });

/* Slider handlers (sync state) */
scaleInput.addEventListener('input', (e) => {
  const newScale = parseFloat(e.target.value);
  if(Number.isFinite(newScale)){
    playerState.scale = newScale;
    needsRender = true;
  }
});
rotationInput.addEventListener('input', (e) => {
  const deg = parseFloat(e.target.value) || 0;
  playerState.rotation = deg * Math.PI / 180;
  needsRender = true;
});

/* Draw helpers */
function drawBackground(){
  const g = ctx.createLinearGradient(0,0,1080,1080);
  g.addColorStop(0, '#0f172a');
  g.addColorStop(1, '#2563eb');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,1080,1080);
}

function drawPlayer(){
  if(!playerImg) return;
  ctx.save();
  ctx.translate(playerState.x, playerState.y);
  ctx.rotate(playerState.rotation);
  const drawW = playerImg.width * playerState.scale;
  const drawH = playerImg.height * playerState.scale;
  ctx.drawImage(playerImg, -drawW/2, -drawH/2, drawW, drawH);
  ctx.restore();
}

function drawBadge(){
  if(!badgeImg) return;
  const badgeSize = 120;
  const badgeX = 40;
  const badgeY = 886;
  ctx.save();
  ctx.beginPath();
  ctx.arc(badgeX + badgeSize/2, badgeY + badgeSize/2, badgeSize/2, 0, Math.PI*2);
  ctx.closePath();
  ctx.clip();
  ctx.drawImage(badgeImg, badgeX, badgeY, badgeSize, badgeSize);
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,0.95)';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.arc(badgeX + badgeSize/2, badgeY + badgeSize/2, badgeSize/2, 0, Math.PI*2);
  ctx.stroke();
}

function drawText(){
  const playerName = playerNameInput.value || 'Player Name';
  const clubName = clubNameInput.value || 'Club Name';
  const sponsor = sponsorInput.value || 'Sponsored by...';

  // top bar
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0,0,1080,110);

  ctx.fillStyle = '#fff';
  ctx.font = '800 54px Inter, system-ui';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(clubName, 540, 55);

  // lower panel
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(0,860,1080,170);

  ctx.fillStyle = '#fff';
  ctx.font = '800 72px Inter, system-ui';
  ctx.textAlign = 'center';
  ctx.fillText(playerName, 590, 930);

  ctx.font = '600 30px Inter, system-ui';
  ctx.fillText(sponsor, 590, 1000);
}

/* Render only when needed */
function render(){
  if(!needsRender) return;
  needsRender = false;
  ctx.clearRect(0,0,1080,1080);
  drawBackground();
  drawPlayer();
  drawText();
  drawBadge();
}

/* RAF loop */
function rafLoop(){
  render();
  requestAnimationFrame(rafLoop);
}
requestAnimationFrame(rafLoop);

/* Generate button */
$('generateBtn').addEventListener('click', () => {
  needsRender = true;
  status.textContent = 'Preview updated';
});

/* Download (2x export for higher resolution) */
function sanitizeFilename(name){
  return name.trim().toLowerCase().replace(/[^a-z0-9\-]+/g,'-').replace(/^-+|-+$/g,'') || 'image-creator-pro';
}

$('downloadBtn').addEventListener('click', async () => {
  try{
    clearError();
    status.innerHTML = 'Preparing download <span class="spinner" aria-hidden="true"></span>';
    const scale = 2;
    const exportCanvas = document.createElement('canvas');
    exportCanvas.width = 1080 * scale;
    exportCanvas.height = 1080 * scale;
    const ectx = exportCanvas.getContext('2d', { alpha: false });

    // background
    const g = ectx.createLinearGradient(0,0,exportCanvas.width,exportCanvas.height);
    g.addColorStop(0, '#0f172a');
    g.addColorStop(1, '#2563eb');
    ectx.fillStyle = g;
    ectx.fillRect(0,0,exportCanvas.width,exportCanvas.height);

    // player image (apply transforms scaled)
    if(playerImg){
      ectx.save();
      ectx.translate(playerState.x * scale, playerState.y * scale);
      ectx.rotate(playerState.rotation);
      const drawW = playerImg.width * playerState.scale * scale;
      const drawH = playerImg.height * playerState.scale * scale;
      ectx.drawImage(playerImg, -drawW/2, -drawH/2, drawW, drawH);
      ectx.restore();
    }

    // top bar
    ectx.fillStyle = 'rgba(0,0,0,0.55)';
    ectx.fillRect(0,0,exportCanvas.width,110*scale);

    // club name
    ectx.fillStyle = '#fff';
    ectx.textAlign = 'center';
    ectx.textBaseline = 'middle';
    ectx.font = `800 ${54*scale}px Inter, system-ui`;
    ectx.fillText(clubNameInput.value || 'Club Name', exportCanvas.width/2, 55*scale);

    // lower panel
    ectx.fillStyle = 'rgba(0,0,0,0.75)';
    ectx.fillRect(0,860*scale,exportCanvas.width,170*scale);

    ectx.fillStyle = '#fff';
    ectx.font = `800 ${72*scale}px Inter, system-ui`;
    ectx.fillText(playerNameInput.value || 'Player Name', 590*scale, 930*scale);

    ectx.font = `600 ${30*scale}px Inter, system-ui`;
    ectx.fillText(sponsorInput.value || 'Sponsored by...', 590*scale, 1000*scale);

    // badge
    if(badgeImg){
      const badgeSize = 120*scale;
      const badgeX = 40*scale;
      const badgeY = 886*scale;
      ectx.save();
      ectx.beginPath();
      ectx.arc(badgeX + badgeSize/2, badgeY + badgeSize/2, badgeSize/2, 0, Math.PI*2);
      ectx.closePath();
      ectx.clip();
      ectx.drawImage(badgeImg, badgeX, badgeY, badgeSize, badgeSize);
      ectx.restore();
      ectx.strokeStyle = 'rgba(255,255,255,0.95)';
      ectx.lineWidth = 5*scale;
      ectx.beginPath();
      ectx.arc(badgeX + badgeSize/2, badgeY + badgeSize/2, badgeSize/2, 0, Math.PI*2);
      ectx.stroke();
    }

    const filename = sanitizeFilename(playerNameInput.value || 'image-creator-pro') + '.png';
    exportCanvas.toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      status.textContent = 'Download ready';
    }, 'image/png');
  }catch(err){
    showError('Failed to export image');
    console.error(err);
  }
});

/* Keyboard shortcuts: G = generate, D = download */
window.addEventListener('keydown', (e) => {
  if(e.key.toLowerCase() === 'g') { needsRender = true; status.textContent = 'Preview updated'; }
  if(e.key.toLowerCase() === 'd') { $('downloadBtn').click(); }
});

/* initial render */
needsRender = true;
</script>
</body>
</html>
