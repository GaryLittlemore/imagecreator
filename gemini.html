<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Sports Card Generator</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #151f32;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            margin-bottom: 24px;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-align: center;
            font-weight: 800;
        }

        h1 span {
            color: var(--accent-color);
        }

        .container {
            display: flex;
            flex-direction: row;
            gap: 40px;
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            max-width: 950px;
            width: 100%;
        }

        .controls {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #94a3b8;
            font-weight: 600;
        }

        input[type="text"], input[type="file"] {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0b0f19;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        .color-pickers {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #0b0f19;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        input[type="color"] {
            border: none;
            width: 32px;
            height: 32px;
            cursor: pointer;
            background: transparent;
        }

        .preview-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        canvas {
            background: #000;
            border-radius: 16px;
            box-shadow: 0 12px 36px rgba(0,0,0,0.5);
            max-width: 100%;
            height: auto;
        }

        .btn {
            background: var(--accent-color);
            color: #0b0f19;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.2s, transform 0.1s;
            margin-top: 10px;
        }

        .btn:hover {
            background: #7dd3fc;
            transform: translateY(-1px);
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <h1>Card <span>Studio</span></h1>

    <div class="container">
        <div class="controls">
            <div class="control-group">
                <label for="playerName">Player Name</label>
                <input type="text" id="playerName" value="Erling Haaland" placeholder="e.g. Erling Haaland">
            </div>

            <div class="control-group">
                <label for="clubName">Club Name</label>
                <input type="text" id="clubName" value="Manchester City" placeholder="e.g. Manchester City">
            </div>

            <div class="control-group">
                <label for="sponsorName">Sponsor</label>
                <input type="text" id="sponsorName" value="Etihad Airways" placeholder="Sponsor">
            </div>

            <div class="control-group">
                <label>Theme Palette</label>
                <div class="color-pickers">
                    <div class="color-picker-wrapper">
                        <input type="color" id="color1" value="#87cefa">
                        <label for="color1">Primary</label>
                    </div>
                    <div class="color-picker-wrapper">
                        <input type="color" id="color2" value="#212749">
                        <label for="color2">Secondary</label>
                    </div>
                </div>
            </div>

            <div class="control-group">
                <label for="playerImg">Player Portrait (Full Photo)</label>
                <input type="file" id="playerImg" accept="image/*">
            </div>

            <div class="control-group">
                <label for="badgeImg">Team Badge</label>
                <input type="file" id="badgeImg" accept="image/*">
            </div>

            <button class="btn" id="downloadBtn">Download Graphics</button>
        </div>

        <div class="preview-area">
            <canvas id="cardCanvas" width="420" height="580"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('cardCanvas');
        const ctx = canvas.getContext('2d');

        // Inputs DOM Reference
        const playerNameInput = document.getElementById('playerName');
        const clubNameInput = document.getElementById('clubName');
        const sponsorNameInput = document.getElementById('sponsorName');
        const color1Input = document.getElementById('color1');
        const color2Input = document.getElementById('color2');
        const playerImgInput = document.getElementById('playerImg');
        const badgeImgInput = document.getElementById('badgeImg');
        const downloadBtn = document.getElementById('downloadBtn');

        let loadedPlayerImg = null;
        let loadedBadgeImg = null;

        // Auto-sizing Text logic
        function drawAutosizedText(ctx, text, x, y, maxWidth, baseSize, fontFace, weight = 'bold') {
            let fontSize = baseSize;
            ctx.font = `${weight} ${fontSize}px ${fontFace}`;
            while (ctx.measureText(text).width > maxWidth && fontSize > 11) {
                fontSize--;
                ctx.font = `${weight} ${fontSize}px ${fontFace}`;
            }
            ctx.fillText(text, x, y);
            return fontSize;
        }

        function drawCard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Core Background Gradient
            const bgGradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            bgGradient.addColorStop(0, color1Input.value);
            bgGradient.addColorStop(1, color2Input.value);
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Subtle abstract pattern for sports styling overlay
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.beginPath();
            ctx.moveTo(canvas.width, 0);
            ctx.lineTo(canvas.width * 0.2, canvas.height);
            ctx.lineTo(canvas.width, canvas.height);
            ctx.closePath();
            ctx.fill();

            // 2. Full Portrait Player Image Render
            if (loadedPlayerImg) {
                const imgRatio = loadedPlayerImg.width / loadedPlayerImg.height;
                const canvasRatio = canvas.width / canvas.height;
                
                let renderWidth, renderHeight, xOffset, yOffset;

                if (imgRatio > canvasRatio) {
                    renderHeight = canvas.height;
                    renderWidth = canvas.height * imgRatio;
                    xOffset = (canvas.width - renderWidth) / 2;
                    yOffset = 0;
                } else {
                    renderWidth = canvas.width;
                    renderHeight = canvas.width / imgRatio;
                    xOffset = 0;
                    yOffset = (canvas.height - renderHeight) / 2;
                }

                ctx.drawImage(loadedPlayerImg, xOffset, yOffset, renderWidth, renderHeight);
            } else {
                ctx.fillStyle = 'rgba(255,255,255,0.15)';
                ctx.textAlign = 'center';
                ctx.font = '600 15px sans-serif';
                ctx.fillText('[UPLOAD FULL PLAYER PORTRAIT]', canvas.width / 2, canvas.height / 2);
            }

            // 3. Clean Lower Third Text Shadow Backdrop
            const gradientHeight = 180;
            const textFade = ctx.createLinearGradient(0, canvas.height - gradientHeight, 0, canvas.height);
            textFade.addColorStop(0, 'rgba(0, 0, 0, 0.0)');
            textFade.addColorStop(0.3, 'rgba(0, 0, 0, 0.65)');
            textFade.addColorStop(1, 'rgba(0, 0, 0, 0.95)');
            ctx.fillStyle = textFade;
            ctx.fillRect(0, canvas.height - gradientHeight, canvas.width, gradientHeight);

            // 4. Render Badge Graphic
            const textLeftPadding = 35;
            const badgeSize = 44;
            const badgeY = canvas.height - 75;
            let finalTextWidth = canvas.width - (textLeftPadding * 2);

            if (loadedBadgeImg) {
                const badgeX = canvas.width - textLeftPadding - badgeSize;
                ctx.drawImage(loadedBadgeImg, badgeX, badgeY, badgeSize, badgeSize);
                finalTextWidth = badgeX - textLeftPadding - 15;
            }

            // 5. Typography Layout (Matching exact case typed by user)
            ctx.textAlign = 'left';
            
            // Player Name Text (Uses system default fonts seamlessly if Impact isn't preferred for mixed-case)
            ctx.fillStyle = '#ffffff';
            const nameY = canvas.height - 82;
            drawAutosizedText(ctx, playerNameInput.value, textLeftPadding, nameY, finalTextWidth, 32, 'Arial, Helvetica, sans-serif', 'bold');

            // Team Label Text
            ctx.fillStyle = 'rgba(255, 255, 255, 0.75)'; 
            const teamY = canvas.height - 62;
            drawAutosizedText(ctx, clubNameInput.value, textLeftPadding, teamY, finalTextWidth, 14, 'Arial, sans-serif', '600');

            // Clean Sponsor Presentation Line
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.font = 'bold 9px Arial';
            ctx.fillText('SPONSOR', textLeftPadding, canvas.height - 38);

            ctx.fillStyle = '#ffffff';
            const sponsorY = canvas.height - 22;
            drawAutosizedText(ctx, sponsorNameInput.value, textLeftPadding, sponsorY, finalTextWidth, 14, 'Arial', 'bold');
        }

        // Image stream pipeline configurations
        function processImage(e, targetAssignee) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    if (targetAssignee === 'player') loadedPlayerImg = img;
                    if (targetAssignee === 'badge') loadedBadgeImg = img;
                    drawCard();
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        }

        // Live DOM UI Node Action Listeners
        playerNameInput.addEventListener('input', drawCard);
        clubNameInput.addEventListener('input', drawCard);
        sponsorNameInput.addEventListener('input', drawCard);
        color1Input.addEventListener('input', drawCard);
        color2Input.addEventListener('input', drawCard);

        playerImgInput.addEventListener('change', (e) => processImage(e, 'player'));
        badgeImgInput.addEventListener('change', (e) => processImage(e, 'badge'));

        // Output File System triggers
        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            const sanitizedName = playerNameInput.value.trim().toLowerCase().replace(/[^a-z0-9]+/g, '_');
            link.download = `${sanitizedName || 'player'}_card.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        // Initialize empty base template build
        window.onload = drawCard;
    </script>
</body>
</html>
