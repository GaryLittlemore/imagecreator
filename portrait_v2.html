<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Image Creator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:        #080c14;
            --panel:     #0f1624;
            --border:    #1e2d45;
            --accent:    #f0b429;
            --accent2:   #38bdf8;
            --text:      #f1f5f9;
            --muted:     #64748b;
            --radius:    14px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        header {
            margin-bottom: 36px;
            text-align: center;
        }

        header h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(2rem, 5vw, 3.2rem);
            letter-spacing: 6px;
            line-height: 1;
        }

        header h1 em {
            font-style: normal;
            color: var(--accent);
        }

        header p {
            margin-top: 8px;
            font-size: 0.85rem;
            color: var(--muted);
            letter-spacing: 1px;
        }

        .layout {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 28px;
            width: 100%;
            max-width: 960px;
        }

        /* ── Controls Panel ─────────────────────────── */
        .controls {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section-label {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--muted);
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--muted);
        }

        .field input[type="text"] {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            padding: 10px 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .field input[type="text"]:focus {
            border-color: var(--accent);
        }

        .color-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .color-swatch {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .color-swatch:hover { border-color: var(--accent); }

        .color-swatch input[type="color"] {
            width: 28px;
            height: 28px;
            border: none;
            background: none;
            cursor: pointer;
            padding: 0;
        }

        .color-swatch span {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .upload-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg);
            border: 1px dashed var(--border);
            border-radius: 8px;
            padding: 12px 14px;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            font-size: 0.85rem;
            color: var(--muted);
            font-family: 'DM Sans', sans-serif;
        }

        .upload-btn:hover {
            border-color: var(--accent2);
            color: var(--accent2);
            background: rgba(56, 189, 248, 0.04);
        }

        .upload-btn.loaded {
            border-color: #22c55e;
            color: #22c55e;
            border-style: solid;
        }

        .upload-btn input[type="file"] { display: none; }

        .upload-btn svg { flex-shrink: 0; }

        .btn-download {
            background: var(--accent);
            color: #080c14;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 4px;
        }

        .btn-download:hover {
            background: #fbbf24;
            transform: translateY(-1px);
        }

        /* ── Preview Panel ───────────────────────────── */
        .preview-panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px;
        }

        canvas {
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 480px;
            height: auto;
            display: block;
        }

        @media (max-width: 720px) {
            .layout { grid-template-columns: 1fr; }
            .preview-panel { order: -1; }
        }
    </style>
</head>
<body>

<header>
    <h1>Player <em>Image</em> Creator</h1>
    <p>Build a high-res player card — download at 1200 × 1656 px</p>
</header>

<div class="layout">

    <!-- Controls -->
    <div class="controls">

        <p class="section-label">Player Details</p>

        <div class="field">
            <label for="playerName">Player Name</label>
            <input type="text" id="playerName" placeholder="e.g. Marcus Rashford">
        </div>

        <div class="field">
            <label for="clubName">Club Name</label>
            <input type="text" id="clubName" placeholder="e.g. Manchester United">
        </div>

        <div class="field">
            <label for="sponsorName">Sponsor</label>
            <input type="text" id="sponsorName" placeholder="e.g. Nike">
        </div>

        <p class="section-label">Theme Palette</p>

        <div class="color-row">
            <label class="color-swatch">
                <input type="color" id="color1" value="#87cefa">
                <span>Primary</span>
            </label>
            <label class="color-swatch">
                <input type="color" id="color2" value="#212749">
                <span>Secondary</span>
            </label>
        </div>

        <p class="section-label">Assets</p>

        <label class="upload-btn" id="playerUploadLabel">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <span id="playerUploadText">Upload Player Portrait</span>
            <input type="file" id="playerImg" accept="image/*">
        </label>

        <label class="upload-btn" id="badgeUploadLabel">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <span id="badgeUploadText">Upload Team Badge</span>
            <input type="file" id="badgeImg" accept="image/*">
        </label>

        <button class="btn-download" id="downloadBtn">⬇ Download PNG</button>

    </div>

    <!-- Preview -->
    <div class="preview-panel">
        <canvas id="cardCanvas" width="1200" height="1656"></canvas>
    </div>

</div>

<script>
    // ─── Canvas constants ──────────────────────────────────────────────────────
    const CANVAS_W          = 1200;
    const CANVAS_H          = 1656;
    const TEXT_PADDING      = 100;   // horizontal inset for all text
    const GRADIENT_HEIGHT   = 560;   // height of the lower-third vignette
    const BADGE_SIZE        = 130;   // rendered width/height of team badge
    const BADGE_MARGIN      = 40;    // gap between badge and text block
    const FONT_MIN_SIZE     = 16;    // floor for auto-shrinking text

    // Row baselines measured from canvas bottom
    const ROW_PLAYER_NAME   = 250;
    const ROW_CLUB_NAME     = 185;
    const ROW_SPONSOR_LABEL = 115;
    const ROW_SPONSOR_VALUE = 62;

    // ─── State ────────────────────────────────────────────────────────────────
    let playerImg = null;
    let badgeImg  = null;

    // ─── DOM refs ─────────────────────────────────────────────────────────────
    const canvas          = document.getElementById('cardCanvas');
    const ctx             = canvas.getContext('2d');
    const playerNameInput = document.getElementById('playerName');
    const clubNameInput   = document.getElementById('clubName');
    const sponsorInput    = document.getElementById('sponsorName');
    const color1Input     = document.getElementById('color1');
    const color2Input     = document.getElementById('color2');
    const playerImgInput  = document.getElementById('playerImg');
    const badgeImgInput   = document.getElementById('badgeImg');
    const downloadBtn     = document.getElementById('downloadBtn');

    // ─── Helpers ──────────────────────────────────────────────────────────────

    /**
     * Draw text, shrinking font size until it fits within maxWidth.
     * Returns the font size actually used.
     */
    function drawFittedText(text, x, y, maxWidth, baseSize, weight = 'bold') {
        const FONT_FACE = "'Bebas Neue', 'Arial Narrow', Arial, sans-serif";
        let size = baseSize;
        ctx.font = `${weight} ${size}px ${FONT_FACE}`;
        while (ctx.measureText(text).width > maxWidth && size > FONT_MIN_SIZE) {
            size -= 2;
            ctx.font = `${weight} ${size}px ${FONT_FACE}`;
        }
        ctx.fillText(text, x, y);
        return size;
    }

    /**
     * Scale an image to cover the canvas, anchoring to the top
     * (preserves faces in portrait photos rather than center-cropping).
     */
    function drawCoverTopAnchored(img) {
        const imgRatio    = img.width / img.height;
        const canvasRatio = CANVAS_W / CANVAS_H;

        let rw, rh, rx, ry;

        if (imgRatio > canvasRatio) {
            // Image is wider than canvas — fit height, clip sides
            rh = CANVAS_H;
            rw = CANVAS_H * imgRatio;
            rx = (CANVAS_W - rw) / 2;
            ry = 0;
        } else {
            // Image is taller / same ratio — fit width, anchor top
            rw = CANVAS_W;
            rh = CANVAS_W / imgRatio;
            rx = 0;
            ry = 0; // top-anchored so heads are never cropped
        }

        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, rx, ry, rw, rh);
    }

    // ─── Main draw ────────────────────────────────────────────────────────────
    function drawCard() {
        ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

        // 1. Background gradient
        const bg = ctx.createLinearGradient(0, 0, CANVAS_W, CANVAS_H);
        bg.addColorStop(0, color1Input.value);
        bg.addColorStop(1, color2Input.value);
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

        // 2. Subtle dark diagonal overlay for depth
        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        ctx.beginPath();
        ctx.moveTo(CANVAS_W, 0);
        ctx.lineTo(CANVAS_W * 0.2, CANVAS_H);
        ctx.lineTo(CANVAS_W, CANVAS_H);
        ctx.closePath();
        ctx.fill();

        // 3. Player portrait
        if (playerImg) {
            drawCoverTopAnchored(playerImg);
        } else {
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            ctx.textAlign = 'center';
            ctx.font = '500 36px "DM Sans", sans-serif';
            ctx.fillText('Upload a portrait photo', CANVAS_W / 2, CANVAS_H / 2);
        }

        // 4. Lower-third vignette
        const vignette = ctx.createLinearGradient(0, CANVAS_H - GRADIENT_HEIGHT, 0, CANVAS_H);
        vignette.addColorStop(0,   'rgba(0,0,0,0)');
        vignette.addColorStop(0.3, 'rgba(0,0,0,0.65)');
        vignette.addColorStop(1,   'rgba(0,0,0,0.95)');
        ctx.fillStyle = vignette;
        ctx.fillRect(0, CANVAS_H - GRADIENT_HEIGHT, CANVAS_W, GRADIENT_HEIGHT);

        // 5. Team badge (right-aligned, vertically centred on name row)
        const badgeX = CANVAS_W - TEXT_PADDING - BADGE_SIZE;
        const badgeY = CANVAS_H - ROW_PLAYER_NAME - BADGE_SIZE / 2; // centred on name baseline

        if (badgeImg) {
            ctx.drawImage(badgeImg, badgeX, badgeY, BADGE_SIZE, BADGE_SIZE);
        }

        // Available text width — narrowed when badge is present
        const textMaxW = badgeImg
            ? badgeX - TEXT_PADDING - BADGE_MARGIN
            : CANVAS_W - TEXT_PADDING * 2;

        ctx.textAlign = 'left';

        // 6. Player name
        ctx.fillStyle = '#ffffff';
        drawFittedText(
            playerNameInput.value || 'PLAYER NAME',
            TEXT_PADDING,
            CANVAS_H - ROW_PLAYER_NAME,
            textMaxW,
            110,
            'bold'
        );

        // 7. Club name
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        drawFittedText(
            clubNameInput.value || 'Club Name',
            TEXT_PADDING,
            CANVAS_H - ROW_CLUB_NAME,
            textMaxW,
            44,
            '600'
        );

        // 8. Sponsor block — only rendered when a sponsor is provided
        const sponsorText = sponsorInput.value.trim();
        if (sponsorText) {
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.font = '600 26px "DM Sans", sans-serif';
            ctx.fillText('Sponsored by', TEXT_PADDING, CANVAS_H - ROW_SPONSOR_LABEL);

            ctx.fillStyle = '#ffffff';
            drawFittedText(sponsorText, TEXT_PADDING, CANVAS_H - ROW_SPONSOR_VALUE, textMaxW, 44, 'bold');
        }
    }

    // ─── Image loading ────────────────────────────────────────────────────────
    function loadImage(file, onLoad) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => { onLoad(img); drawCard(); };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    // ─── Event listeners ──────────────────────────────────────────────────────
    playerNameInput.addEventListener('input', drawCard);
    clubNameInput.addEventListener('input', drawCard);
    sponsorInput.addEventListener('input', drawCard);
    color1Input.addEventListener('input', drawCard);
    color2Input.addEventListener('input', drawCard);

    playerImgInput.addEventListener('change', (e) => {
        loadImage(e.target.files[0], (img) => { playerImg = img; });
        document.getElementById('playerUploadText').textContent = e.target.files[0]?.name ?? 'Upload Player Portrait';
        document.getElementById('playerUploadLabel').classList.toggle('loaded', !!e.target.files[0]);
    });

    badgeImgInput.addEventListener('change', (e) => {
        loadImage(e.target.files[0], (img) => { badgeImg = img; });
        document.getElementById('badgeUploadText').textContent = e.target.files[0]?.name ?? 'Upload Team Badge';
        document.getElementById('badgeUploadLabel').classList.toggle('loaded', !!e.target.files[0]);
    });

    downloadBtn.addEventListener('click', () => {
        const slug = playerNameInput.value.trim().toLowerCase().replace(/[^a-z0-9]+/g, '_') || 'player';
        const link = document.createElement('a');
        link.download = `${slug}_card.png`;
        link.href = canvas.toDataURL('image/png', 1.0);
        link.click();
    });

    // ─── Initial render ───────────────────────────────────────────────────────
    drawCard();
</script>
</body>
</html>
